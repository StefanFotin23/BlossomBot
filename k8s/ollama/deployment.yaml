apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  labels:
    app: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:latest
        ports:
        - containerPort: 11434
        env:
        - name: OLLAMA_HOST
          value: "0.0.0.0"
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        volumeMounts:
        - name: ollama-data
          mountPath: /root/.ollama
        livenessProbe:
          httpGet:
            path: /
            port: 11434
          initialDelaySeconds: 30 # Ollama might take longer to start or load models
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 11434
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: ollama-data
        persistentVolumeClaim:
          claimName: ollama-pvc
      initContainers:
      - name: pull-romistral-model
        image: ollama/ollama:latest # Use the same Ollama image
        command: ["/bin/sh", "-c"]
        args:
          - |
            ollama serve &
            SERVER_PID=$!
            until ollama list > /dev/null 2>&1; do
              echo "Waiting for ollama server..."
              sleep 2
            done
            ollama pull romistral
            kill $SERVER_PID
        volumeMounts:
        - name: ollama-data
          mountPath: /root/.ollama # Mount the same volume to store the model
