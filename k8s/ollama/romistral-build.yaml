apiVersion: batch/v1
kind: Job
metadata:
  name: romistral-builder
  labels:
    app: romistral-builder
spec:
  backoffLimit: 0 # We want to see failures clearly, and it's idempotent anyway
  template:
    metadata:
      labels:
        app: romistral-builder
    spec:
      restartPolicy: Never
      containers:
        - name: builder
          image: stefanfotin23/romistral-builder
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "4"
              memory: "7Gi"
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e

              # Use the PVC mount for everything to ensure caching
              WORKSPACE="/root/.ollama/build-cache"
              mkdir -p "$WORKSPACE"
              cd "$WORKSPACE"

              # Start a temporary local ollama server to check/register models
              echo "=== Starting Ollama Server ==="
              ollama serve &
              OLLAMA_PID=$!
              sleep 10

              if ollama list | grep -q "romistral"; then
                echo "=== SUCCESS: Model 'romistral' already exists in Ollama. Skipping build. ==="
                kill $OLLAMA_PID
                exit 0
              fi

              if [ ! -f "romistral-7b-q4_k_m.gguf" ]; then
                echo "=== GGUF not found. Starting build process... ==="

                echo "=== SMART CACHE: Checking Hugging Face model ==="
                if [ ! -d "RoMistral-7b-Instruct/.git" ]; then
                  echo "Cloning repository (15GB)..."
                  git clone https://huggingface.co/OpenLLM-Ro/RoMistral-7b-Instruct
                else
                  echo "HF Repo found on PVC. Skipping clone."
                fi

                echo "=== SMART CACHE: Checking llama.cpp ==="
                if [ ! -f "llama.cpp/build/bin/llama-quantize" ]; then
                  echo "Cloning and building llama.cpp..."
                  [ ! -d "llama.cpp" ] && git clone https://github.com/ggml-org/llama.cpp
                  cd llama.cpp
                  cmake -B build
                  cmake --build build --config Release -j$(nproc)
                  cd ..
                else
                  echo "llama.cpp already compiled on PVC. Skipping build."
                fi

                echo "=== Installing Python deps ==="
                pip install --no-cache-dir -r llama.cpp/requirements.txt

                echo "=== Converting HF -> GGUF (F16) ==="
                if [ ! -f "romistral-7b-f16.gguf" ]; then
                  python llama.cpp/convert_hf_to_gguf.py \
                    RoMistral-7b-Instruct \
                    --outtype f16 \
                    --outfile romistral-7b-f16.gguf
                fi

                echo "=== Quantizing (Q4_K_M) ==="
                ./llama.cpp/build/bin/llama-quantize \
                  romistral-7b-f16.gguf \
                  romistral-7b-q4_k_m.gguf \
                  Q4_K_M

                echo "=== CLEANUP: Removing ONLY the 15GB intermediate file ==="
                # We KEEP RoMistral-7b-Instruct and llama.cpp on the PVC for future runs!
                rm -f romistral-7b-f16.gguf
              else
                echo "=== Found cached GGUF file. Skipping conversion/quantization. ==="
              fi

              echo "=== Registering model with Ollama ==="
              echo "FROM ./romistral-7b-q4_k_m.gguf" > Modelfile
              ollama create romistral -f Modelfile

              echo "=== Final Cleanup ==="
              kill $OLLAMA_PID
              echo "=== Done! ==="
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
      volumes:
        - name: ollama-data
          persistentVolumeClaim:
            claimName: ollama-pvc