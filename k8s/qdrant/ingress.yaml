apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qdrant-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - http:
      paths:
      - path: /qdrant
        pathType: Prefix
        backend:
          service:
            name: qdrant
            port:
              number: 6333
