kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
  extraPortMappings:
  - containerPort: 80
    hostPort: 40080
    protocol: TCP
  - containerPort: 443
    hostPort: 40443
    protocol: TCP
  - containerPort: 30081 # NodePort for Qdrant
    hostPort: 40081      # Host port for Qdrant
    protocol: TCP
  - containerPort: 30082 # NodePort for Ollama
    hostPort: 40082      # Host port for Ollama
    protocol: TCP
